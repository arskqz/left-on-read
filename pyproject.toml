[project]
name = "dataformatter"
version = "0.1.0"
description = "Local desktop tool for reviewing and editing chat-format fine-tuning datasets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
dataformatter = "dataformatter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
